// ── Intro: coloured dots gather into the line-up
const LX = (i) => 960 + (i - 3.5) * 176, LY = 640;
$('#ldots').innerHTML = CREW.map((c) => `<i class="ldot" style="background:${c.bg}"></i>`).join('');
$('#lineup').innerHTML = CREW.map((c, i) => `<div class="lav" style="left:${LX(i)}px; top:${LY - 59}px"><img src="${img(c.id)}" alt=""><span>${c.name}</span></div>`).join('');
const ldots = [...document.querySelectorAll('.ldot')], lavs = [...document.querySelectorAll('.lav')];
const DOT0 = CREW.map((_, i) => [960 + Math.cos(i * 0.9 + 0.4) * (420 + rand(i + 3) * 380), 560 + Math.sin(i * 1.3 + 1) * (180 + rand(i + 9) * 160)]);
const HOOK = words($('#hook'), 'Every great team has <em>specialists.</em>');
const MEET = words($('#meet'), 'Meet yours.');

// ── Share: the crew and your team on one history
const SH_Y = 580;
const TEAM = ['sam', 'aisha', 'dev', 'lin'];
const agX = (i) => 300 + i * 175, huX = (i) => 560 + i * 270;
$('#savs').innerHTML = CREW.map((c, i) => `<img class="sav" src="${img(c.id)}" style="left:${agX(i)}px; top:${SH_Y - 130}px" alt="">`).join('') +
  TEAM.map((h, i) => `<img class="sav h" src="../../assets/helpin/avatars/${h}.webp" style="left:${huX(i)}px; top:${SH_Y + 130}px" alt="">`).join('');
$('#stems').innerHTML = CREW.map((_, i) => `<i class="stem" style="left:${agX(i) - 1}px; top:${SH_Y - 85}px; height:0"></i>`).join('') + TEAM.map((_, i) => `<i class="stem" style="left:${huX(i) - 1}px; top:${SH_Y}px; height:0"></i>`).join('');
const savs = [...document.querySelectorAll('.sav')], stems = [...document.querySelectorAll('.stem')];
css($('#slot'), { left: `${agX(8)}px`, top: `${SH_Y - 178}px` });

// ── End
const esym = helpinSymbol({ size: 150, color: '#FFFFFF' });
$('#esym').append(esym.node);
const ETAG = words($('#etag'), 'Meet your crew.');
$('#orbs').innerHTML = CREW.map((c) => `<i class="orb" style="background:${c.bg}"></i>`).join('');
const orbs = [...document.querySelectorAll('.orb')];

const T = { hook: W('hook'), spec: W('hook', 4), meet: W('meet'), share: W('share'), history: WP('share', 'history'), ask: WP('share', 'ask'), act: WP('share', 'act'),
  own: W('own'), build: WP('own', 'build'), end: W('end'), crew: WP('end', 'meet') };

// ── per-agent vignette animation (t, section start a)
function VIG_rows(prefix, n, t, at, gap, color) {
  for (let i = 1; i <= n; i++) {
    const el = document.getElementById(`${prefix}${i}`), s = at + (i - 1) * gap;
    inOut(el, t, s, { dy: 12, dur: 0.4 });
    const ic = el.querySelector('i');
    if (ic && color) { const on = t >= s + 0.25; ic.style.background = on ? color : 'transparent'; ic.style.borderColor = on ? color : '#D5DBD8'; ic.textContent = on ? '✓' : ''; }
  }
}
const VIG = {
  echo(t, a) {
    inOut($('#ve'), t, a + 0.35, { dy: 30 });
    inOut($('#ve1'), t, W('echo', 3) - 0.1, { dy: 14 });
    inOut($('#ve2'), t, WP('echo', 'help') - 0.15, { dy: 14 });
    stamp($('#vec1'), t, W('echo', 7)); stamp($('#vec2'), t, W('echo', 10) + 0.1);
    inOut($('#ve3'), t, W('echo', 11) - 0.1, { dy: 14 });
    inOut($('#ve4'), t, WP('echo', 'bring') - 0.1, { dy: 14 });
  },
  atlas(t, a) {
    [1, 2, 3].forEach((i) => { const at = WP('atlas', 'customer') - 0.2 + (i - 1) * 0.15, k = E(P(t, at, at + 0.5)); css($(`#vas${i}`), { opacity: String(k), marginTop: `${Math.round((1 - k) * 30)}px` }); });
    [1, 2, 3].forEach((i) => drawP($(`#va-l${i}`), E(P(t, WP('atlas', 'into') + (i - 1) * 0.1, WP('atlas', 'into') + 0.5 + (i - 1) * 0.1))));
    inOut($('#vap'), t, WP('atlas', 'plan') - 0.35, { dy: 24 });
    VIG_rows('var', 4, t, WP('atlas', 'plan'), 0.15, '#D85A30');
    stamp($('#varb'), t, WP('atlas', 'review'));
  },
  scribe(t, a) {
    inOut($('#vs'), t, a + 0.35, { dy: 30 });
    VIG_rows('vsr', 4, t, WP('scribe', 'details') - 0.1, 0.22, '#1D9E75');
    stamp($('#vsb'), t, WP('scribe', 'begins'));
  },
  forge(t, a) {
    inOut($('#vf'), t, a + 0.35, { dy: 30 });
    [...document.querySelectorAll('#vfl .ln')].forEach((l, i) => { const at = WP('forge', 'writes') + i * 0.1; const k = E(P(t, at, at + 0.35)); css(l, { opacity: String(k), transform: k < 1 ? `translateX(${Math.round((1 - k) * -24)}px)` : 'none' }); });
    inOut($('#vft'), t, WP('forge', 'runs') - 0.25, { dy: 16 });
    [...document.querySelectorAll('#vfdots .dot')].forEach((d, i) => { d.style.background = t >= WP('forge', 'runs') + 0.1 + i * 0.1 ? '#1D9E75' : '#D5DBD8'; });
    $('#vftx').textContent = t >= WP('forge', 'runs') + 0.95 ? '24 passed' : '';
    inOut($('#vfp'), t, WP('forge', 'opens') - 0.1, { dy: 30 });
  },
  lens(t, a) {
    inOut($('#vl'), t, a + 0.35, { dy: 30 });
    [...document.querySelectorAll('#vll .ln')].forEach((l, i) => inOut(l, t, a + 0.5 + i * 0.06, { dy: 8, dur: 0.3 }));
    const g = P(t, WP('lens', 'looks') - 0.1, WP('lens', 'tests') + 0.5);
    const gp = [L(980, 1500, E(g)), 400 + Math.sin(g * Math.PI * 2) * 90 + g * 120];
    $('#vlgg').setAttribute('transform', `translate(${Math.round(gp[0])} ${Math.round(gp[1])})`);
    $('#vlg').style.opacity = String(E(P(t, WP('lens', 'looks') - 0.2, WP('lens', 'looks') + 0.1)));
    stamp($('#vlf1'), t, WP('lens', 'risks')); stamp($('#vlf2'), t, WP('lens', 'missing'));
  },
  quill(t, a) {
    inOut($('#vq'), t, a + 0.35, { dy: 30 });
    $('#vqs').style.width = `${Math.round(E(P(t, WP('quill', 'prepares'), WP('quill', 'prepares') + 0.4)) * 470)}px`;
    inOut($('#vqnew'), t, WP('quill', 'your'), { dy: 10 });
    stamp($('#vqb'), t, WP('quill', 'updates'));
  },
  beacon(t, a) {
    inOut($('#vb'), t, a + 0.35, { dy: 30 });
    VIG_rows('vbr', 3, t, a + 0.7, 0.2, null);
    inOut($('#vbe'), t, WP('beacon', 'followup') - 0.3, { dy: 30 });
    stamp($('#vbk'), t, WP('beacon', 'ready'));
  },
  mira(t, a) {
    [1, 2, 3].forEach((i) => {
      const at = WP('mira', 'signals') - 0.35 + (i - 1) * 0.12, k = E(P(t, at, at + 0.5)), fly = expoInOut(P(t, WP('mira', 'launch') - 0.1 + (i - 1) * 0.08, WP('mira', 'launch') + 0.55 + (i - 1) * 0.08));
      css($(`#vm${i}`), { opacity: String(k * (1 - fly)), transform: `translate(${Math.round((1 - k) * -40 + fly * 380)}px, ${Math.round(fly * (i - 2) * -60)}px) scale(${L(1, 0.5, fly).toFixed(3)})` });
    });
    inOut($('#vmc'), t, WP('mira', 'into') - 0.2, { dy: 30 });
    VIG_rows('vmr', 3, t, WP('mira', 'launch') + 0.2, 0.18, '#E07B1A');
    inOut($('#vmch'), t, WP('mira', 'messaging') + 0.2, { dy: 10 });
  },
};
defineVideo({
  width: 1920, height: 1080, fps: 30, duration: total,
  scenes: [{ id: 'film', start: 0, end: total, render: ({ t }) => {
    // ── intro
    const iOn = t < A[0] + 0.8;
    $('#intro').style.opacity = iOn ? '1' : '0';
    if (iOn) {
      const hk = t < T.meet - 0.1;
      $('#hook').style.opacity = String(1 - E(P(t, T.meet - 0.35, T.meet - 0.05)));
      rise(HOOK, t, T.hook - 0.1, 0.1);
      $('#meet').style.opacity = String(t >= T.meet - 0.05 ? 1 - E(P(t, A[0] - 0.1, A[0] + 0.2)) : 0);
      if (t >= T.meet - 0.05) rise(MEET, t, T.meet - 0.05, 0.12);
      CREW.forEach((c, i) => {
        const gather = expoInOut(P(t, T.meet - 0.2 + i * 0.04, T.meet + 0.55 + i * 0.04));
        const drift = [Math.sin(t * 0.9 + i) * 24, Math.cos(t * 0.7 + i * 2) * 18];
        const x = L(DOT0[i][0] + drift[0], LX(i), gather), y = L(DOT0[i][1] + drift[1], LY, gather);
        css(ldots[i], { left: `${Math.round(x)}px`, top: `${Math.round(y)}px`, opacity: String(E(P(t, 0.1 + i * 0.08, 0.6 + i * 0.08)) * (1 - E(P(t, T.meet + 0.35 + i * 0.04, T.meet + 0.6 + i * 0.04)))), transform: `scale(${L(1, 3, gather).toFixed(3)})` });
        const ak = E(P(t, T.meet + 0.3 + i * 0.04, T.meet + 0.8 + i * 0.04));
        // Echo steps forward into its own section; the rest of the crew waits in the dark
        const lead = i === 0 ? expoInOut(P(t, A[0] - 0.35, A[0] + 0.25)) : 0;
        const fadeRest = i === 0 ? 0 : E(P(t, A[0] - 0.4, A[0]));
        css(lavs[i], { opacity: String(ak * (1 - fadeRest)), transform: lead > 0 ? `translate(${Math.round((330 - LX(0)) * lead)}px, ${Math.round((330 - LY) * lead)}px) scale(${L(1, 1.78, lead).toFixed(3)})` : (ak < 1 ? `translateY(${Math.round((1 - ak) * 24)}px)` : 'none') });
        lavs[i].querySelector('span').style.opacity = String(1 - lead);
      });
    }

    // ── agent sections: a circle of colour bursts out of the avatar
    CREW.forEach((c, i) => {
      const el = secEls[i], a = A[i], b = A[i + 1];
      const on = t >= a && t < b + 0.8;
      el.style.display = on ? 'block' : 'none';
      if (!on) return;
      const r = expoInOut(P(t, a, a + 0.7));
      el.style.clipPath = r >= 1 ? 'none' : `circle(${Math.round(L(0, 2300, r))}px at 330px 330px)`;
      const big = el.querySelector('.big');
      const bk = expoOut(P(t, a + 0.05, a + 0.6));
      css(big, { transform: `translateY(${Math.round(Math.sin((t - a) * 2.2) * 5)}px) scale(${L(0.7, 1, bk).toFixed(3)}) rotate(${((1 - bk) * -14).toFixed(1)}deg)` });
      inOut(el.querySelector('.badge'), t, a + 0.25);
      const nk = E(P(t, a + 0.2, a + 0.75));
      css(el.querySelector('.nm'), { opacity: String(nk), transform: nk < 1 ? `translateX(${Math.round((1 - nk) * -50)}px)` : 'none', clipPath: `inset(0 ${((1 - nk) * 100).toFixed(1)}% 0 0)` });
      inOut(el.querySelector('.role'), t, a + 0.45);
      inOut(el.querySelector('.out'), t, a + 0.7);
      VIG[c.id](t, a);
    });

    // ── share: the crew and your team on one history; they ask first; room for your own
    const sOn = t >= A[8];
    const sr = expoInOut(P(t, A[8], A[8] + 0.7));
    css($('#share'), { opacity: sOn ? '1' : '0', clipPath: sOn && sr < 1 ? `circle(${Math.round(L(0, 2300, sr))}px at 960px 540px)` : 'none', background: '#111315' });
    if (sOn) {
      const shOut = E(P(t, T.end - 0.4, T.end + 0.1));
      $('#share').style.filter = shOut > 0.001 ? `blur(${(shOut * 8).toFixed(1)}px)` : 'none';
      $('#share').style.opacity = String(1 - shOut);
      inOut($('#shl'), t, A[8] + 0.4);
      const lw = E(P(t, T.share - 0.1, T.share + 0.8));
      $('#hline').setAttribute('x2', L(260, 1660, lw).toFixed(1));
      savs.forEach((s, i) => {
        const at = i < 8 ? T.share + 0.1 + i * 0.07 : WP('share', 'team') - 0.1 + (i - 8) * 0.1;
        const k = E(P(t, at, at + 0.5));
        css(s, { opacity: String(k), transform: k < 1 ? `translateY(${Math.round((1 - k) * (i < 8 ? -30 : 30))}px) scale(${L(0.7, 1, k).toFixed(3)})` : 'none' });
        const st = stems[i], sk = E(P(t, at + 0.25, at + 0.6));
        st.style.height = `${Math.round(sk * 40)}px`;
        if (i >= 8) st.style.top = `${SH_Y + 5}px`; else st.style.top = `${SH_Y - 45 + Math.round((1 - sk) * 40)}px`;
      });
      const cp = P(t, T.history - 0.1, T.history + 0.9);
      css($('#comet'), { opacity: String(cp > 0 && cp < 1 ? 1 : 0), left: `${Math.round(L(260, 1660, E(cp)))}px`, top: `${SH_Y}px` });
      const ap = t >= T.ask - 0.2 && t < T.build - 0.2;
      inOut($('#apr'), t, T.ask - 0.2, { out: T.build - 0.1 });
      const approved = t >= T.act + 0.05;
      $('#aprb').textContent = approved ? 'Approved ✓' : 'Approve';
      $('#aprb').classList.toggle('ok', approved);
      const bx = 620 + 680 - 24 - 70, by = 820 + 55;
      const cur = keys(t, [[T.ask + 0.2, [1700, 1100]], [T.act - 0.08, [bx, by - 8], E]]);
      css($('#cursor'), { opacity: String(ap ? E(P(t, T.ask + 0.2, T.ask + 0.45)) * (1 - P(t, T.act + 0.4, T.act + 0.7)) : 0), transform: `translate(${Math.round(cur[0])}px, ${Math.round(cur[1])}px) scale(${t > T.act - 0.04 && t < T.act + 0.08 ? 0.86 : 1})` });
      // the empty slot at the end of the line becomes your agent
      inOut($('#slot'), t, T.own + 0.1);
      const fk = E(P(t, T.build, T.build + 0.5));
      css($('#slot .fill'), { opacity: String(fk), transform: fk < 1 ? `scale(${L(0.4, 1, fk).toFixed(3)})` : 'none' });
      $('#slot circle').style.strokeDashoffset = String(-t * 20);
    } else $('#cursor').style.opacity = '0';

    // ── end
    const eOn = t >= T.end - 0.4;
    $('#end').style.opacity = String(eOn ? E(P(t, T.end - 0.4, T.end + 0.2)) : 0);
    if (eOn) {
      esym.assemble(P(t, T.end - 0.2, T.end + 0.7));
      const wk = E(P(t, T.end, T.end + 0.7));
      css($('#eword'), { clipPath: `inset(0 ${((1 - wk) * 100).toFixed(1)}% 0 0)` });
      rise(ETAG, t, T.crew, 0.12);
      inOut($('#ecta'), t, T.crew + 0.8);
      orbs.forEach((o, i) => {
        const ang = t * 0.35 + (i / 8) * Math.PI * 2, k = E(P(t, T.end + i * 0.06, T.end + 0.6 + i * 0.06));
        css(o, { left: `${Math.round(960 + Math.cos(ang) * 640)}px`, top: `${Math.round(470 + Math.sin(ang) * 330)}px`, opacity: String(k * 0.9) });
      });
    }
  } }],
});

</script>
</body>
</html>
