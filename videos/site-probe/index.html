<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>siteView probe</title>
<link rel="stylesheet" href="../../lib/brand.css">
<style>.cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; } #stage { background: #fff; }</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="ws"><div class="cam" id="c1"></div></section>
  <section class="scene" id="fu"><div class="cam" id="c2"></div></section>
  <section class="scene" id="ap"><div class="cam" id="c3"></div></section>
</div>
<script type="module">
import { defineVideo, waitFor } from '../../lib/runtime.js';
import { siteView, frameRect } from '../../lib/site.js';
const $ = (s) => document.querySelector(s);
const views = {
  ws: siteView($('#c1'), { path: '/products/customer-support', focus: '.support-connected-preview .support-workspace', hide: ['canvas'] }),
  fu: siteView($('#c2'), { path: '/products/customer-support', focus: '#support-workflow article:nth-child(3)', hide: ['canvas'] }),
  ap: siteView($('#c3'), { path: '/products/ai-agents', focus: '#agent-controls .awa-approval', hide: ['canvas'] }),
};
Object.values(views).forEach((v) => waitFor(v.ready));
const box = { x: 40, y: 40, w: 1840, h: 1000 };
const scene = (id, cam, start, end) => ({ id, start, end, render: ({ lt }) => {
  const r = views[id].rect(); if (r) frameRect($(cam), r, box);
  return views[id].update(lt);
} });
defineVideo({ width: 1920, height: 1080, fps: 30, scenes: [scene('ws', '#c1', 0, 16), scene('fu', '#c2', 16, 22), scene('ap', '#c3', 22, 27)] });
</script>
</body>
</html>
