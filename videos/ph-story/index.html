<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helpin — The story block (Product Hunt, narrated)</title>
<link rel="stylesheet" href="../../lib/brand.css">
<style>
  @import url('../../node_modules/@fontsource-variable/instrument-sans/wdth.css');
  /* The narrated Product Hunt film, at the density of CircleCI's explainer: one glowing story block that never
     stops transforming (a drifting ring → an outline → a fill → messages written in → a launch → hops → chips →
     rewind → the Helpin mark → a pipeline ride → rings), with light trails, doodle confetti, speed lines and kinetic
     type on the voice. Forest dark, mint and emerald glow, agent colours as neon. Voice (Bella) snapped to the
     music's beats (music.json); effects on the same anchors (cues.mjs). */
  :root { --em: #2FBF7A; --mint: #9CDBB3; --cyan: #5CE1E6; --red: #FF5A5F; --white: #EAF3EE; --dim: rgba(156, 219, 179, .6); }
  #stage { background: radial-gradient(ellipse 80% 80% at 50% 45%, #10261E, #081813 55%, #040C09); color: var(--white); }
  #bg, #world, #wel, #txt { position: absolute; inset: 0; }
  #bg i { position: absolute; left: 0; top: 0; }
  #world { transform-origin: 0 0; }
  svg.layer { position: absolute; left: 0; top: 0; overflow: visible; }
  .kt { position: absolute; left: 0; width: 1920px; text-align: center; font-family: 'Instrument Sans Variable', var(--sans); font-stretch: 75%; font-weight: 700; letter-spacing: -0.015em; line-height: 0.95; color: var(--white); white-space: nowrap; text-shadow: 0 0 40px rgba(92, 224, 150, .25); }
  .kt span { display: inline-block; opacity: 0; }
  .kt em { font-style: normal; color: var(--mint); }
  .mono { font: 600 24px/1 var(--mono); letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }
  #block { position: absolute; left: 0; top: 0; width: 230px; height: 230px; margin: -115px 0 0 -115px; }
  #block .face { position: absolute; inset: 0; border-radius: 58px; background: linear-gradient(140deg, #6BE3A1, #2FBF7A 55%, #1C9E63); box-shadow: 0 0 60px rgba(92, 224, 150, .65), 0 0 150px rgba(92, 224, 150, .3), inset 0 2px 0 rgba(255, 255, 255, .35); }
  #block .g { position: absolute; left: 0; top: 0; }
  #block svg.ol { position: absolute; left: -3px; top: -3px; overflow: visible; }
  #block svg.ol rect { fill: none; stroke: #EAF3EE; stroke-width: 4; }
  .pill { border-radius: 8px; } .circ { border-radius: 50%; }
  #bloom { position: absolute; left: 0; top: 0; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(circle, rgba(92, 224, 150, .42), rgba(92, 224, 150, 0) 62%); }
  .req { position: absolute; left: 0; top: 0; padding: 14px 20px; border-radius: 18px 18px 18px 5px; font: 600 24px/1 var(--sans); color: #06231F; white-space: nowrap; box-shadow: 0 0 26px rgba(92, 225, 230, .55); }
  .node { position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 4px solid rgba(156, 219, 179, .85); box-shadow: 0 0 36px rgba(92, 224, 150, .4), inset 0 0 26px rgba(92, 224, 150, .2); display: grid; place-items: center; background: rgba(6, 20, 15, .75); }
  .node svg { width: 64px; height: 64px; overflow: visible; }
  .node svg path { fill: none; stroke: var(--mint); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .orb { position: absolute; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; display: grid; place-items: center; }
  .orb img { width: 76px; height: 76px; }
  .alab { position: absolute; left: 0; top: 0; width: 460px; margin-left: -230px; text-align: center; }
  .alab b { display: block; font-family: 'Instrument Sans Variable', var(--sans); font-stretch: 75%; font-weight: 700; font-size: 76px; line-height: 1; letter-spacing: -0.01em; color: var(--white); }
  .alab span { display: block; margin-top: 10px; font: 600 24px/1 var(--mono); letter-spacing: .2em; color: var(--mint); text-transform: uppercase; }
  .panel { position: absolute; left: 0; top: 0; border-radius: 22px; background: rgba(4, 16, 12, .9); box-shadow: 0 0 0 2px rgba(156, 219, 179, .35), 0 0 50px rgba(92, 224, 150, .2); padding: 22px 26px; font: 500 40px/1.6 var(--mono); color: #CFE3D6; white-space: nowrap; }
  .panel .r { color: #FF8A8E; } .panel .g { color: #9CF0BE; }
  #mark { position: absolute; left: 0; top: 0; }
  #wm { position: absolute; left: 0; width: 1920px; text-align: center; font-family: 'Instrument Sans Variable', var(--sans); font-weight: 650; font-size: 150px; letter-spacing: -0.05em; line-height: 1; }
  .sw { position: absolute; left: 0; top: 0; width: 170px; margin-left: -85px; text-align: center; }
  .sw .tr { width: 150px; height: 70px; margin: 0 auto; border-radius: 35px; background: rgba(255, 255, 255, .1); position: relative; box-shadow: inset 0 0 0 2px rgba(156, 219, 179, .4); }
  .sw .kn { position: absolute; left: 7px; top: 7px; width: 56px; height: 56px; border-radius: 50%; background: var(--em); box-shadow: 0 0 20px rgba(92, 224, 150, .9); }
  .sw b { display: block; margin-top: 16px; font: 600 22px/1 var(--mono); letter-spacing: .12em; color: var(--dim); }
  #term { position: absolute; left: 50%; top: 860px; transform: translateX(-50%); height: 90px; padding: 0 34px; border-radius: 22px; background: rgba(4, 14, 11, .9); box-shadow: 0 0 0 2px rgba(156, 219, 179, .35), 0 0 40px rgba(92, 224, 150, .25); display: flex; align-items: center; gap: 16px; font: 500 34px/1 var(--mono); color: #CFE3D6; white-space: nowrap; }
  #term .p { color: var(--mint); }
  #cta { position: absolute; left: 0; width: 1920px; top: 800px; display: flex; justify-content: center; gap: 16px; }
  #cta span { height: 66px; padding: 0 30px; border-radius: 16px; display: grid; place-items: center; font: 600 30px/1 var(--sans); }
  #cta .u { background: var(--white); color: #081813; } #cta .o { box-shadow: inset 0 0 0 2px rgba(156, 219, 179, .55); color: var(--white); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="world">
    <svg class="layer" id="wfx" width="10" height="10"><defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><g id="wfxg"></g></svg>
    <div id="wel"></div>
    <div id="bloom"></div>
    <div id="block"><div class="face"></div><div id="gl"></div><svg class="ol" width="236" height="236"><rect id="olr" x="3" y="3" width="230" height="230" rx="58" pathLength="1"/></svg></div>
  </div>
  <svg class="layer" id="sfx" width="1920" height="1080"><g id="sfxg"></g></svg>
  <div id="mark"></div><div id="wm">Helpin</div>
  <div id="txt"></div>
  <div id="term"><span class="p">$</span><span id="cmd"></span></div>
  <div id="cta"><span class="u">helpin.ai</span><span class="o">Open source</span><span class="o">Self-host free</span></div>
  <section class="scene" id="film" style="visibility:visible"></section>
</div>
<script type="module">
import { defineVideo } from '../../lib/runtime.js';
import { P, L, clamp, rand, keys, expoOut, expoIn, expoInOut, backOut, easeInOut, easeIn } from '../../lib/motion.js';
import { helpinSymbol, css } from '../../lib/components.js';
import { E, voice } from '../../lib/film.js';
import VO from './vo.json' with { type: 'json' };
import MUSIC from './music.json' with { type: 'json' };
import LOGOS from './logos.json' with { type: 'json' }; // tool logos for the ending (prep-logos.mjs)

await Promise.all(['700 150px "Instrument Sans Variable"', '650 150px "Instrument Sans Variable"'].map((f) => document.fonts.load(f)));
const $ = (s) => document.querySelector(s);
const { W, S, END, total } = voice(VO);
const ease = (t, a, d = 0.4, f = E) => f(P(t, a, a + d));
const onBeat = (t) => { const b = (t - MUSIC.firstBeat) / MUSIC.period; return b - Math.floor(b); };
const pulse = (t) => Math.exp(-onBeat(t) * MUSIC.period / 0.12);
const AG = (n) => `../../assets/helpin/agents/${n}.svg`;
const RED = '#FF5A5F', MINT = '#9CDBB3', CYAN = '#5CE1E6', EM = '#2FBF7A', WHITE = '#EAF3EE';

// ════════ shared kit ════════
let WF = '', SF = ''; // world / screen fx buffers
const svgLine = (x1, y1, x2, y2, { w = 3, c = MINT, o = 1, dash = '', cap = 'round' } = {}) => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap}" opacity="${Math.max(0, o).toFixed(3)}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const svgRing = (x, y, r, { w = 3, c = MINT, o = 1, dash = '', rot = 0, fill = 'none' } = {}) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${Math.max(0, r).toFixed(1)}" fill="${fill}" stroke="${c}" stroke-width="${w}" opacity="${Math.max(0, o).toFixed(3)}"${dash ? ` stroke-dasharray="${dash}" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"` : ''}/>`;
const svgDot = (x, y, r, c, o = 1, blur = false) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${Math.max(0, r).toFixed(1)}" fill="${c}" opacity="${Math.max(0, o).toFixed(3)}"${blur ? ' filter="url(#soft)"' : ''}/>`;
const svgPath = (d, { w = 4, c = MINT, o = 1, k = 1, blur = false } = {}) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1 - clamp(k)).toFixed(4)}" opacity="${Math.max(0, o).toFixed(3)}"${blur ? ' filter="url(#soft)"' : ''}/>`;
// a light trail behind anything whose position is a function of time
function trail(pos, t, { len = 0.35, n = 22, w = 16, c = MINT, o = 0.8, t0 = -1e9 } = {}) {
  let s = ''; let prev = pos(t);
  for (let i = 1; i <= n; i++) { const tt = t - (len * i) / n; if (tt < t0) break; const p = pos(tt), k = 1 - i / n; s += svgLine(prev[0], prev[1], p[0], p[1], { w: w * (0.35 + 0.65 * k), c, o: o * k * k }); prev = p; }
  return s;
}
// the camera: design point (cx, cy) at the screen centre, scale s
let CAM = [960, 540, 1];
const setCam = (cx, cy, s) => { CAM = [cx, cy, s]; $('#world').style.transform = `translate(${(960 - cx * s).toFixed(1)}px, ${(540 - cy * s).toFixed(1)}px) scale(${s.toFixed(4)})`; };
// radial speed lines around a screen point
function speed(t, x, y, k, { n = 26, r0 = 260, len = 380, seed = 1 } = {}) {
  if (k <= 0.01) return '';
  let s = '';
  for (let i = 0; i < n; i++) { const a = rand(i + seed) * Math.PI * 2, ph = (t * (1.4 + rand(i + seed + 40)) + rand(i + seed + 80)) % 1, r = r0 + ph * 700; s += svgLine(x + Math.cos(a) * r, y + Math.sin(a) * r, x + Math.cos(a) * (r + len * (0.4 + rand(i + seed + 120) * 0.6)), y + Math.sin(a) * (r + len * 0.6), { w: 2, c: WHITE, o: k * 0.5 * Math.sin(ph * Math.PI) }); }
  return s;
}
// doodle confetti: outline glyphs that burst out of a point and drift
const DOODLE = ['M-9 -9L9 9M9 -9L-9 9', 'M0 -10A10 10 0 1 0 0.1 -10', 'M-8 -8H8V8H-8Z', 'M0 -11L11 0L0 11L-11 0Z', 'M-12 2C-8 -6 -4 10 0 2S8 -6 12 2', 'M0 -10V10M-10 0H10', 'M0 -9L3 -3L9 -3L4 1L6 8L0 4L-6 8L-4 1L-9 -3L-3 -3Z', 'M0 8C-12 0 -8 -10 0 -4C8 -10 12 0 0 8Z', 'M0 -10L10 8H-10Z'];
function burst(t, t0, x, y, { n = 30, v = 900, life = 1.8, seed = 1, cols = [WHITE, MINT], hearts = false } = {}) {
  const lt = t - t0; if (lt < 0 || lt > life) return '';
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = rand(i * 3 + seed) * Math.PI * 2, sp = v * (0.35 + rand(i * 7 + seed) * 0.8), k = 1 - Math.exp(-lt * 3.2);
    const px = x + Math.cos(a) * sp * k / 3.2, py = y + Math.sin(a) * sp * k / 3.2 + 30 * lt * lt;
    const d = hearts && i % 3 === 0 ? DOODLE[7] : DOODLE[Math.floor(rand(i * 11 + seed) * DOODLE.length)];
    s += `<path d="${d}" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(rand(i + seed) * 360 + lt * 120).toFixed(1)}) scale(${(0.9 + rand(i * 5 + seed) * 0.9).toFixed(2)})" fill="none" stroke="${cols[i % cols.length]}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="${(Math.min(1, lt * 8) * (1 - P(lt, life * 0.55, life))).toFixed(3)}"/>`;
  }
  return s;
}
// kinetic text: a line of words, each with its own entrance time
function kt(id, html, { top, size = 150, cls = '' } = {}) {
  const el = document.createElement('div'); el.className = `kt ${cls}`; el.id = id; el.style.top = `${top}px`; el.style.fontSize = `${size}px`;
  el.innerHTML = html.split(/(?<!<em)\s+(?![^<]*<\/em>)/).map((w) => `<span>${w}</span>`).join(' '); // phrases inside <em> stay whole
  $('#txt').append(el); return el;
}
const words = (el) => [...el.querySelectorAll('span')];
function rise(el, t, ats, { dy = 50, blur = 12, out = Infinity, outDur = 0.35, outDy = -40 } = {}) {
  const on = t < out + 0.05; el.style.display = on && t >= Math.min(...ats) - 0.1 ? 'block' : 'none'; if (el.style.display === 'none') return;
  const o = ease(t, out - outDur, outDur);
  words(el).forEach((w, i) => { const at = ats[Math.min(i, ats.length - 1)], k = expoOut(P(t, at - 0.04, at + 0.3)); css(w, { opacity: String(P(t, at - 0.04, at + 0.04) * (1 - o)), transform: `translateY(${((1 - k) * dy + o * outDy).toFixed(1)}px) scale(${L(1.08, 1, k).toFixed(3)})`, filter: k < 1 || o > 0 ? `blur(${(Math.max(1 - k, o) * blur).toFixed(1)}px)` : 'none' }); });
}

// ════════ the cast ════════
// background doodles, drifting
$('#bg').innerHTML = Array.from({ length: 46 }, (_, i) => `<i><svg width="40" height="40" viewBox="-20 -20 40 40"><path d="${DOODLE[i % 7]}" fill="none" stroke="rgba(156,219,179,.22)" stroke-width="2" stroke-linecap="round"/></svg></i>`).join('');
const bgEls = [...document.querySelectorAll('#bg i')];
const BG = bgEls.map((_, i) => ({ x: rand(i + 1) * 1920, y: rand(i + 71) * 1080, vx: (rand(i + 141) - 0.5) * 20, vy: (rand(i + 211) - 0.5) * 14, s: 0.5 + rand(i + 281) * 1.0, r: rand(i + 351) * 360 }));
// the story block: rows of glyphs (messages, tasks, fixes)
const GL = []; {
  const rows = [[['pill', 54], ['circ', 16], ['pill', 30], ['pill', 44]], [['circ', 16], ['pill', 70], ['tri', 18], ['pill', 30]], [['pill', 40], ['pill', 24], ['circ', 16], ['pill', 50]],
    [['tri', 18], ['pill', 60], ['circ', 16], ['pill', 34]], [['pill', 36], ['circ', 16], ['pill', 64]], [['circ', 16], ['pill', 44], ['pill', 28], ['tri', 18]]];
  rows.forEach((row, r) => { let x = 26; row.forEach(([k, w], j) => { const cyan = (r * 3 + j) % 5 === 0, light = (r + j) % 3 === 0; GL.push({ k, w, x, y: 30 + r * 30, r, col: cyan ? CYAN : light ? '#E7F8EE' : '#0B6340' }); x += w + 10; }); });
}
$('#gl').innerHTML = GL.map((g) => g.k === 'tri' ? `<svg class="g" width="${g.w}" height="16" style="left:${g.x}px;top:${g.y}px"><path d="M${g.w / 2} 1 L${g.w - 1} 15 L1 15 Z" fill="${g.col}"/></svg>` : `<i class="g ${g.k}" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:16px;background:${g.col}"></i>`).join('');
const glEls = [...document.querySelectorAll('#gl .g')];
const tint = (i, c) => { const el = glEls[i]; if (el.tagName === 'svg') el.firstElementChild.setAttribute('fill', c); else el.style.background = c; el.style.boxShadow = c === RED ? '0 0 12px rgba(255, 90, 95, .8)' : 'none'; };
const block = (x, y, s, { rot = 0, o = 1, glow = 1, fill = 1, outline = 0, rows = 6 } = {}) => {
  css($('#block'), { transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${Math.max(0.001, s).toFixed(4)})`, opacity: String(o) });
  $('#block .face').style.clipPath = fill >= 1 ? 'none' : `inset(0 ${((1 - fill) * 100).toFixed(1)}% 0 0 round 58px)`;
  const ol = $('#olr'); ol.style.strokeDasharray = '1'; ol.style.strokeDashoffset = String(1 - outline); ol.style.opacity = String(outline > 0 && fill < 1 ? 1 : outline > 0 ? 1 - P(fill, 0.8, 1) : 0);
  css($('#bloom'), { transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(Math.max(0.001, s) * glow).toFixed(3)})`, opacity: String(o * Math.min(1, glow) * fill) });
};
// chipping: when each glyph breaks off (the old way) and how it falls
const CHIP = glEls.map((_, i) => ({ at: [W('path', 7) - 0.1, W('path', 11) - 0.1, W('lost', 3), W('lost', 3) + 0.25, W('lost', 10), W('cost', 1)][i % 6] + rand(i + 5) * 0.2, vx: (rand(i + 55) - 0.5) * 520, vy: -160 - rand(i + 77) * 260, rot: (rand(i + 99) - 0.5) * 720, keep: i % 6 === 5 }));
const REW = [W('whatif', 0) - 0.1, W('whatif', 5) + 0.15]; // the rewind
// requests that swirl in (they tell you what they need)
const REQS = ['Export to CSV?', 'SSO for our team?', 'Bulk-edit tasks?', 'Invoices in EUR?', 'Slack alerts?', 'Dark mode?'];
const REQC = [CYAN, MINT, '#FFFFFF', CYAN, MINT, '#FFFFFF'];
$('#wel').innerHTML = REQS.map((r, i) => `<div class="req" style="background:${REQC[i]}">${r}</div>`).join('');
const reqEls = [...document.querySelectorAll('.req')];
// nodes (stations) and orbs (agents), created on demand in #wel
const ICON = { support: 'M8 10h32v22H20l-10 9v-9H8z', product: 'M10 10h12v12H10z M26 10h12v12H26z M10 26h12v12H10z M26 26h12v12H26z', eng: 'M17 12l-10 12 10 12 M31 12l10 12-10 12',
  chat: 'M8 10h32v22H20l-10 9v-9H8z', task: 'M11 9h26v30H11z M17 23l5 5 10-10', fix: 'M17 12l-10 12 10 12 M31 12l10 12-10 12', review: 'M22 8a14 14 0 1 0 .1 0 M32 32l8 8', approve: 'M9 24l10 10 20-20', docs: 'M14 6h14l8 8v28H14z M28 6v8h8',
  crm: 'M24 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M9 42c1-9 7-13 15-13s14 4 15 13', meetings: 'M7 14h24v20H7z M31 20l10-6v20l-10-6', server: 'M9 8h30v12H9z M9 26h30v12H9z', cloud: 'M12 34h24a9 9 0 0 0 1-18 12 12 0 0 0-23 3 8 8 0 0 0-2 15z', flag: 'M12 6v36 M12 8h22l-5 7 5 7H12' };
const NODES = {};
const node = (id, icon) => { if (!NODES[id]) { const el = document.createElement('div'); el.className = 'node'; el.innerHTML = `<svg viewBox="0 0 48 48"><path d="${ICON[icon]}"/></svg>`; $('#wel').append(el); NODES[id] = el; } return NODES[id]; };
const showNode = (id, icon, x, y, t, at, { o = 1, s = 1 } = {}) => { const el = node(id, icon), k = backOut(P(t, at, at + 0.4), 2); css(el, { display: 'grid', opacity: String(P(t, at, at + 0.1) * o), transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(L(0.2, 1, Math.min(1, k)) * s).toFixed(3)})` }); };
const AGENTS = { echo: '#D4537E', forge: '#534AB7', lens: '#BA7517', quill: '#185FA5', beacon: '#0F766E', atlas: '#D85A30' };
const ORBS = {};
const orb = (id) => { if (!ORBS[id]) { const el = document.createElement('div'); el.className = 'orb'; el.style.background = AGENTS[id]; el.style.boxShadow = `0 0 34px ${AGENTS[id]}CC, 0 0 90px ${AGENTS[id]}66`; el.innerHTML = `<img src="${AG(id)}" alt="">`; $('#wel').append(el); ORBS[id] = el; } return ORBS[id]; };
const showOrb = (id, x, y, t, at, { o = 1, s = 1 } = {}) => { const el = orb(id), k = backOut(P(t, at, at + 0.4), 2); css(el, { display: 'grid', opacity: String(P(t, at, at + 0.1) * o), transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(L(0.2, 1, Math.min(1, k)) * s).toFixed(3)})` }); };
const ROLE = { echo: 'Support agent', forge: 'Coding agent', lens: 'Code reviewer', quill: 'Docs agent', beacon: 'CRM operator', atlas: 'Epic planner' };
const LABS = {};
const alab = (id) => { if (!LABS[id]) { const el = document.createElement('div'); el.className = 'alab'; el.innerHTML = `<b>${id[0].toUpperCase() + id.slice(1)}</b><span>${ROLE[id]}</span>`; $('#wel').append(el); LABS[id] = el; } return LABS[id]; };
// an agent's card: its avatar, big, in its colour, with its name and role, from the moment the voice names it
function agentCard(id, x, y, t, at, until) {
  if (t < at - 0.05 || t > until + 0.3) return;
  const o = 1 - P(t, until, until + 0.3), k = backOut(P(t, at - 0.05, at + 0.35), 2.2);
  showOrb(id, x, y, t, at - 0.05, { s: 1.7, o });
  const lk = expoOut(P(t, at + 0.05, at + 0.4)), el = alab(id);
  css(el, { display: 'block', transform: `translate(${x.toFixed(1)}px, ${(y + 115 + (1 - lk) * 24).toFixed(1)}px)`, opacity: String(P(t, at + 0.05, at + 0.15) * o) });

    // ════ G (36.9 → 55.3): the pipeline ride ════

    }

      const pos = (i, tt) => {
        const f = FRAG[i], k = expoIn(P(tt, gather0 + f.d, land)), jit = (1 - k) * 10;
        return [L(f.x + Math.sin(tt * 7 + i) * jit, 960, k), L(f.y + Math.cos(tt * 6 + i * 2) * jit, 520, k), k];
      };
      FRAG.forEach((f, i) => { const j = FRAG[(i + 5) % FRAG.length]; if (i % 2) return; const a = pos(i, t), b = pos((i + 5) % FRAG.length, t); if (a[2] > 0.05) return; const fl = 0.4 + 0.6 * Math.abs(Math.sin(t * 9 + i)); WF += svgLine(a[0], a[1], L(a[0], b[0], 0.42), L(a[1], b[1], 0.42), { w: 3, c: RED, dash: '10 10', o: fl * ease(t, S('cta') + 0.2, 0.4) }) + svgLine(b[0], b[1], L(b[0], a[0], 0.42), L(b[1], a[1], 0.42), { w: 3, c: RED, dash: '10 10', o: fl * ease(t, S('cta') + 0.2, 0.4) }); });
      FRAG.forEach((f, i) => {
        const [x, y, k] = pos(i, t), app = backOut(P(t, S('cta') - 0.2 + f.d * 0.5, S('cta') + 0.2 + f.d * 0.5), 2);
        if (t < S('cta') - 0.2 + f.d * 0.5 || k >= 0.999) return;
        if (k > 0.02) WF += trail((tt) => pos(i, tt), t, { len: 0.25, w: 12, c: MINT, o: 0.6, t0: gather0 + f.d });
        WF += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(f.r * (1 - k)).toFixed(1)}) scale(${(Math.min(1, app) * L(1, 0.25, k)).toFixed(3)})" opacity="${(1 - P(k, 0.85, 1)).toFixed(3)}"><rect x="-58" y="-58" width="116" height="116" rx="28" fill="rgba(6,20,15,.92)" stroke="${f.lg.fill}" stroke-opacity=".55" stroke-width="3"/><path d="${f.lg.d}" transform="translate(-27 -27) scale(2.25)" fill="${f.lg.fill}"/></g>`;
      });
      // one place: the Helpin mark, a flash, a ring and a burst; then the name and where to go
      sym.assemble(P(t, land - 0.1, land + 0.5));
      css($('#mark'), { opacity: String(P(t, land - 0.1, land)), transform: 'translate(845px, 405px) scale(0.9)', transformOrigin: '115px 115px' });
      const fl = t >= land ? Math.exp(-(t - land) / 0.2) : 0;
      if (fl > 0.01) SF += svgDot(960, 520, 240 + (1 - fl) * 420, MINT, fl * 0.45, true);
      if (t >= land) SF += svgRing(960, 520, 150 + (t - land) * 1300, { w: 6, c: WHITE, o: Math.max(0, 1 - (t - land) * 1.8) });
      SF += burst(t, land, 960, 520, { n: 40, v: 1500, seed: 91, cols: [MINT, WHITE, CYAN] });
      for (let i = 0; i < 3; i++) if (t >= land + 0.4) WF += svgRing(960, 520, 200 + i * 64, { w: 3, c: i % 2 ? CYAN : MINT, o: 0.5 * ease(t, land + 0.4 + i * 0.1, 0.5), dash: `${24 + i * 10} ${14 + i * 6}`, rot: t * (i % 2 ? -26 : 20) });
      const wk = expoOut(P(t, END('cta') + 0.05, END('cta') + 0.5));
      css($('#wm'), { opacity: String(wk), top: '690px', transform: `translateY(${((1 - wk) * 30).toFixed(1)}px)` });
      css($('#cta'), { opacity: String(ease(t, END('cta') + 0.5, 0.5)), top: '885px' });
    }

    $('#wfxg').innerHTML = WF; $('#sfxg').innerHTML = SF;
  } }],
});
</script>
